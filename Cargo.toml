[package]
name = "nanocrx"
version = "0.3.0"
edition = "2024"
description = "A fast, simple and powerful Rust library for working with Chrome extension CRX files."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Lutsic/nanocrx"
keywords = ["chrome", "extension", "crx", "crx3", "browser"]
categories = ["parser-implementations", "web-programming"]
exclude = [".gitignore", "/tests/**", "/.github/**"]

[dependencies]
prost = "0.14.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = "6"